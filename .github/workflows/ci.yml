name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest tests/ -v

  # hacs/action validates the repository's default branch via the GitHub
  # API, not the current checkout - so it can't give a meaningful result on
  # a feature-branch PR before that branch is merged. Full HACS
  # publish-readiness (a public repo, home-assistant/brands submission)
  # is tracked separately; this just catches local regressions once
  # something's actually on main.
  hacs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
